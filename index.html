<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九州大阪 11 日行程表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Zen+Old+Mincho:wght@700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f7f4ee; /* 日本傳統色：鳥之子色 Torinoko */
    }
    .font-wafu {
      font-family: 'Zen Old Mincho', 'Noto Sans TC', serif;
    }
    .custom-map-pin {
      background-color: #1e3a5f; /* 琉璃紺 / 深藍 */
      color: #fff;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
      border: 2px solid #e2d9c8;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.25);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-stone-800 antialiased min-h-screen pb-24 md:pb-8 flex flex-col">

  <!-- Mobile-First Sticky Header -->
  <header class="bg-[#fcfaf7]/95 backdrop-blur-md border-b border-[#e6decb] sticky top-0 z-30 shadow-xs">
    <div class="max-w-4xl mx-auto px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-[#b83b26] flex items-center justify-center text-amber-50 shadow-sm border border-[#9b2f1d]">
          <i data-lucide="compass" class="w-4 h-4"></i>
        </div>
        <div>
          <h1 class="font-bold text-stone-900 text-sm leading-tight font-wafu tracking-wide">
            九州・關西 11 日和風行
          </h1>
          <p class="text-[11px] text-stone-500">主揪：朱家德 ｜ 8 人同行手冊</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="resetBtn" class="p-2 border border-[#dcd2be] hover:bg-[#ede5d3] text-stone-700 rounded-lg text-xs" title="重設預設">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        </button>
        <button id="exportBtn" class="p-2 bg-[#1e2f47] hover:bg-[#152336] text-amber-100 rounded-lg text-xs shadow-sm border border-[#121c2b]" title="備份下載">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Mobile Horizontal Days Bar -->
    <div class="border-t border-[#eee7d8] bg-[#f7f3ea] px-2 py-2">
      <div id="dayNavList" class="flex gap-2 overflow-x-auto no-scrollbar scroll-smooth px-1">
        <!-- Generated by JS -->
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-3 sm:px-4 py-4 w-full flex-1">
    
    <!-- Day Hero Banner with Representative Japanese Traditional Colors -->
    <div id="dayHeroBanner" class="relative rounded-3xl overflow-hidden mb-4 border border-[#d6cbb5] shadow-md min-h-[170px] sm:min-h-[190px] flex flex-col justify-end p-4 sm:p-5 transition-all duration-500 bg-[#1e2f47]">
      <div class="absolute inset-0 bg-gradient-to-t from-[#111923] via-[#1b2a3f]/85 to-[#2a3c56]/70"></div>
      <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#d4af37_1px,transparent_1px)] [background-size:16px_16px]"></div>

      <!-- Content over Banner -->
      <div class="relative z-10">
        <div class="flex items-center justify-between gap-2 mb-1.5">
          <div class="flex items-center gap-2">
            <span id="dayBadge" class="bg-[#b83b26] text-amber-50 text-xs font-bold px-2.5 py-0.5 rounded-full shadow-xs border border-amber-200/30 font-wafu">Day 1</span>
            <span id="dayDate" class="text-xs font-medium text-amber-100/90 drop-shadow-xs">2027/02/07 (週日)</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span id="spotTag" class="text-[11px] font-medium bg-[#131b26]/75 backdrop-blur-md text-amber-300 px-2.5 py-0.5 rounded-md border border-amber-300/30 flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3 h-3 text-amber-400"></i> <span id="spotName">門司港懷舊</span>
            </span>
            <button id="addStopBtn" class="flex items-center gap-1 px-2.5 py-1 bg-amber-50/15 hover:bg-amber-50/25 active:bg-amber-50/30 text-amber-100 rounded-lg text-xs font-medium border border-amber-200/30 transition shadow-xs">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新增
            </button>
          </div>
        </div>
        <h2 id="dayTitle" class="text-lg sm:text-xl font-bold text-amber-50 leading-tight drop-shadow-md font-wafu">北九州抵達 → 門司港散策 → 前往博多</h2>
        <p id="dayNotes" class="text-xs text-stone-200 mt-1 leading-relaxed line-clamp-2 sm:line-clamp-none opacity-90 drop-shadow-xs">重點：下機直奔小倉站寄大行李，遊覽小倉城與門司港，下午前往博多綠色窗口取票。</p>
      </div>
    </div>

    <!-- Map View Area -->
    <div id="mapWrapper" class="bg-[#fcfaf7] rounded-2xl p-2.5 mb-3 border border-[#ded5c2] shadow-xs">
      <div class="flex items-center justify-between px-1 mb-2">
        <span class="text-xs font-bold text-stone-800 flex items-center gap-1.5 font-wafu">
          <i data-lucide="compass" class="w-3.5 h-3.5 text-[#b83b26]"></i> 當日站點巡禮路線
        </span>
        <span class="text-[10px] text-stone-500">雙指可縮放地圖</span>
      </div>
      <div id="itineraryMap" class="w-full h-52 sm:h-64 rounded-xl border border-[#e6decb]"></div>
    </div>

    <!-- Mobile Stop Cards Container -->
    <div class="mb-4">
      <div class="flex items-center justify-between px-1 mb-2">
        <span class="text-xs font-bold text-stone-600 uppercase tracking-wider font-wafu">行程節點與大眾交通時刻</span>
        <span id="stopCountBadge" class="text-[11px] font-semibold text-[#b83b26] bg-[#faebe8] px-2 py-0.5 rounded-full border border-[#f3cfc8]">8 個站點</span>
      </div>
      <div id="mobileCardsContainer" class="space-y-3">
        <!-- Rendered by JS -->
      </div>
    </div>

    <div id="emptyState" class="hidden p-8 text-center bg-[#fcfaf7] rounded-2xl border border-[#ded5c2]">
      <div class="w-12 h-12 bg-[#efe9dc] text-stone-400 rounded-full flex items-center justify-center mx-auto mb-2">
        <i data-lucide="calendar" class="w-6 h-6"></i>
      </div>
      <p class="text-sm font-semibold text-stone-700">本日目前無任何行程安排</p>
      <p class="text-xs text-stone-500 mt-1">點擊上方「新增」安排行程</p>
    </div>

  </main>

  <!-- Mobile Floating Bottom Bar -->
  <div class="fixed bottom-0 inset-x-0 bg-[#fbf9f5]/95 backdrop-blur-md border-t border-[#ded5c2] px-4 py-2 flex items-center justify-around z-30 sm:hidden">
    <button id="toggleMapBtn" class="flex flex-col items-center gap-0.5 text-[#b83b26] py-1">
      <i data-lucide="map" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold">地圖視角</span>
    </button>
    <button id="scrollToTimelineBtn" class="flex flex-col items-center gap-0.5 text-stone-600 hover:text-[#b83b26] py-1">
      <i data-lucide="list-checks" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold">行程細節</span>
    </button>
    <button id="mobileAddBtn" class="flex flex-col items-center gap-0.5 text-stone-600 hover:text-[#b83b26] py-1">
      <i data-lucide="plus-circle" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold">加景點</span>
    </button>
  </div>

  <!-- Edit/Create Modal -->
  <div id="modalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 sticky top-0 bg-white z-10">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-sm">編輯行程點</h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="itemForm" class="p-5 space-y-3.5">
        <input type="hidden" id="editIndex" value="-1">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">開始時間</label>
            <input type="time" id="itemTime" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-[#b83b26]">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">停留時長</label>
            <input type="text" id="itemDuration" placeholder="例如：1小時30分" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-[#b83b26]">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">景點 / 餐廳名稱</label>
          <input type="text" id="itemName" required placeholder="例如：京都御苑 中立賣休憩所" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-[#b83b26]">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">緯度 (Lat)</label>
            <input type="number" step="any" id="itemLat" placeholder="例如：35.0238" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">經度 (Lng)</label>
            <input type="number" step="any" id="itemLng" placeholder="例如：135.7593" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">大眾交通方式與備註</label>
          <textarea id="itemNotes" rows="3" placeholder="【交通】搭乘XX線至XX站下車..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs leading-relaxed"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">周邊 1km 美食清單</label>
          <textarea id="itemFoods" rows="2" placeholder="① 店名（特色說明）② 店名..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs leading-relaxed"></textarea>
        </div>

        <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" id="cancelModalBtn" class="flex-1 py-2.5 border border-slate-200 text-slate-600 rounded-xl text-xs font-semibold">
            取消
          </button>
          <button type="submit" class="flex-1 py-2.5 bg-[#b83b26] text-white rounded-xl text-xs font-semibold shadow-xs hover:bg-[#9b2f1d]">
            儲存
          </button>
        </div>
      </form>
    </div>
  </div>

                <span class="text-stone-500 block text-[11px] mb-1">停留：${stop.duration || '-'}</span>
                <p class="text-stone-600 border-t border-stone-200 pt-1 leading-snug">${stop.notes || ''}</p>
                ${stop.foods ? `<div class="mt-1.5 p-1.5 bg-[#f5ede2] text-[#8e2e1c] rounded-md border border-[#dfd4c0] text-[11px] leading-tight font-medium">🍴 <strong>1km美食：</strong>${stop.foods}</div>` : ''}
              </div>
            `);

          mapMarkersLayer.addLayer(marker);
          mapMarkers.push(marker);
        }
      });

      if (latlngs.length > 1) {
        mapPolyline = L.polyline(latlngs, {
          color: "#b83b26",
          weight: 3.5,
          opacity: 0.85,
          dashArray: "6, 6"
        }).addTo(mapInstance);
      }

      if (latlngs.length > 0) {
        const bounds = L.latLngBounds(latlngs);
        mapInstance.fitBounds(bounds, { padding: [35, 35], maxZoom: 15 });
      }

      setTimeout(() => {
        if (mapInstance) mapInstance.invalidateSize();
      }, 250);
    }

    // 聚焦指定站點
    function focusOnStop(index) {
      const stop = itineraryData[currentDayIndex].stops[index];
      if (!stop || !stop.lat || !stop.lng || !mapInstance) return;

      document.getElementById("mapWrapper").scrollIntoView({ behavior: "smooth", block: "center" });

      setTimeout(() => {
        mapInstance.setView([stop.lat, stop.lng], 15, { animate: true });
        if (mapMarkers[index]) {
          mapMarkers[index].openPopup();
        }
      }, 300);
    }

    // 渲染天數滑動清單
    function renderNav() {
      dayNavList.innerHTML = "";
      itineraryData.forEach((d, idx) => {
        const btn = document.createElement("button");
        const isActive = idx === currentDayIndex;
        btn.className = `shrink-0 px-3 py-1.5 rounded-xl text-left transition border ${
          isActive 
            ? "bg-[#b83b26] border-[#9b2f1d] text-amber-50 shadow-xs font-bold" 
            : "bg-[#f2ece0] border-[#ddd3c0] text-stone-700 hover:bg-[#eae2cf] font-medium"
        }`;
        
        btn.innerHTML = `
          <div class="flex items-center gap-1.5 text-xs">
            <span class="font-wafu">D${d.day}</span>
            <span class="text-[10px] opacity-80">${d.date.split(' ')[0].substring(5)}</span>
          </div>
        `;

        btn.addEventListener("click", () => {
          currentDayIndex = idx;
          renderAll();
          btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        });
        dayNavList.appendChild(btn);
      });
    }

    // 將美食字串解析為附帶 Google Maps 導航按鈕的項目
    function renderFoodItemsHtml(foodsStr) {
      if (!foodsStr) return '';
      
      const parts = foodsStr.split(/(?=①|②|③|④|⑤)/g).filter(p => p.trim());
      
      let badgesHtml = '';
      if (parts.length > 1) {
        badgesHtml = parts.map(part => {
          const cleanText = part.replace(/^[①②③④⑤\s]+/, '').trim();
          const matchName = cleanText.split(/[（(、\s]/)[0] || cleanText;
          return `
            <div class="flex items-start justify-between gap-2 p-2 bg-[#fdfbf7] rounded-lg border border-[#e3d8c1] text-[11px] leading-snug">
              <span class="text-stone-800 flex-1">
                <strong class="text-[#a43420]">${part.match(/^[①②③④⑤]/) ? part.match(/^[①②③④⑤]/)[0] : '•'}</strong> ${cleanText}
              </span>
              <button 
                type="button" 
                data-food-search="${encodeURIComponent(matchName)}" 
                class="shrink-0 px-2 py-0.5 bg-[#f4ebe1] hover:bg-[#ead9c8] text-[#8e2e1c] border border-[#d8c7b0] rounded-md font-semibold text-[10px] flex items-center gap-0.5 active:scale-95 transition"
              >
                <i data-lucide="navigation-2" class="w-3 h-3"></i> 導航
              </button>
            </div>
          `;
        }).join('');
      } else {
        badgesHtml = `
          <div class="p-2 bg-[#fdfbf7] rounded-lg border border-[#e3d8c1] text-[11px] leading-snug text-stone-800 flex items-start justify-between gap-2">
            <span>${foodsStr}</span>
            <button 
              type="button" 
              data-food-search="${encodeURIComponent(foodsStr.substring(0, 10))}" 
              class="shrink-0 px-2 py-0.5 bg-[#f4ebe1] hover:bg-[#ead9c8] text-[#8e2e1c] border border-[#d8c7b0] rounded-md font-semibold text-[10px] flex items-center gap-0.5"
            >
              <i data-lucide="navigation-2" class="w-3 h-3"></i> 導航
            </button>
          </div>
        `;
      }

      return `
        <div class="mt-2.5 p-3 rounded-xl bg-[#f7f1e4] border border-[#ded3be] text-xs leading-relaxed">
          <div class="flex items-center gap-1.5 font-bold text-[#8e2e1c] mb-2 font-wafu">
            <i data-lucide="utensils" class="w-3.5 h-3.5 text-[#b83b26]"></i>
            <span>周邊 1km 美食・Tabelog 高分 / 名物小吃</span>
          </div>
          <div class="space-y-1.5">
            ${badgesHtml}
          </div>
        </div>
      `;
    }

    // 渲染手機專屬直式卡片清單
    function renderDaySchedule() {
      const cur = itineraryData[currentDayIndex];
      dayBadge.textContent = `Day ${cur.day}`;
      dayDate.textContent = cur.date;
      dayTitle.textContent = cur.title;
      dayNotes.textContent = cur.summary;
      stopCountBadge.textContent = `${cur.stops ? cur.stops.length : 0} 個站點`;

      if (spotName) {
        spotName.textContent = cur.spotName || "代表景點";
      }

      mobileCardsContainer.innerHTML = "";

      if (!cur.stops || cur.stops.length === 0) {
        emptyState.classList.remove("hidden");
      } else {
        emptyState.classList.add("hidden");
        cur.stops.forEach((stop, sIdx) => {
          const card = document.createElement("div");
          card.className = "bg-[#fcfaf7] rounded-2xl p-4 border border-[#ded5c2] shadow-xs relative overflow-hidden transition";

          card.innerHTML = `
            <div class="flex items-start justify-between gap-3 mb-2">
              <div class="flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-[#1e2f47] text-amber-100 text-xs font-bold flex items-center justify-center shrink-0 border border-[#142031]">
                  ${sIdx + 1}
                </span>
                <div>
                  <h3 class="font-bold text-stone-900 text-base leading-tight font-wafu">${stop.name}</h3>
                  <div class="flex items-center gap-2 text-xs text-[#a43420] font-semibold mt-0.5">
                    <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${stop.time}</span>
                    <span class="text-stone-300">|</span>
                    <span class="text-stone-600 font-normal">停留 ${stop.duration || "-"}</span>
                  </div>
                </div>
              </div>

              <!-- Top Action Buttons -->
              <div class="flex items-center gap-1.5">
                <button data-action="navigate" data-idx="${sIdx}" class="px-2.5 py-1.5 bg-[#25523b] text-emerald-50 active:bg-[#1b3d2b] rounded-xl text-xs flex items-center gap-1 font-semibold shadow-xs" title="開啟景點 Google Maps 導航">
                  <i data-lucide="navigation" class="w-3.5 h-3.5"></i>
                  <span>導航</span>
                </button>
                <button data-action="locate" data-idx="${sIdx}" class="p-1.5 bg-[#f0eae0] hover:bg-[#e4dcce] text-stone-700 rounded-xl border border-[#ded5c2]" title="在地圖中查看">
                  <i data-lucide="map-pin" class="w-4 h-4 text-[#b83b26]"></i>
                </button>
              </div>
            </div>

            <!-- Notes & Transit Info Box -->
            <div class="mt-2.5 p-3 rounded-xl bg-[#f2ece0] border border-[#e2d8c3] text-xs text-stone-800 leading-relaxed font-normal">
              ${stop.notes || "暫無交通或備註"}
            </div>

            <!-- 1km Famous Food & Snacks Box with Interactive Nav Buttons -->
            ${renderFoodItemsHtml(stop.foods)}

            <!-- Bottom Operation Bar -->
            <div class="flex items-center justify-end gap-2 mt-3 pt-2.5 border-t border-[#eee7d8]">
              <button data-action="edit" data-idx="${sIdx}" class="px-2.5 py-1 text-stone-600 hover:text-stone-900 text-xs font-semibold flex items-center gap-1">
                <i data-lucide="pencil" class="w-3.5 h-3.5"></i> 編輯
              </button>
              <button data-action="delete" data-idx="${sIdx}" class="px-2.5 py-1 text-[#b83b26] hover:text-[#8e2e1c] text-xs font-semibold flex items-center gap-1">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 刪除
              </button>
            </div>
          `;

          mobileCardsContainer.appendChild(card);
        });
      }

      if (window.lucide) lucide.createIcons();
    }

    function renderAll() {
      renderNav();
      renderDaySchedule();
      updateMap();
    }

    // Modal 控制
    function openModal(isEdit = false, index = -1) {
      modalOverlay.classList.remove("hidden");
      if (isEdit && index >= 0) {
        modalTitle.textContent = "修改行程點";
        const stop = itineraryData[currentDayIndex].stops[index];
        editIndexInput.value = index;
        itemTimeInput.value = stop.time;
        itemNameInput.value = stop.name;
        itemDurationInput.value = stop.duration || "";
        itemLatInput.value = stop.lat || "";
        itemLngInput.value = stop.lng || "";
        itemNotesInput.value = stop.notes || "";
        itemFoodsInput.value = stop.foods || "";
      } else {
        modalTitle.textContent = "新增行程點";
        editIndexInput.value = -1;
        itemTimeInput.value = "12:00";
        itemNameInput.value = "";
        itemDurationInput.value = "1時00分";
        itemLatInput.value = "";
        itemLngInput.value = "";
        itemNotesInput.value = "";
        itemFoodsInput.value = "";
      }
    }

    function closeModal() {
      modalOverlay.classList.add("hidden");
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(itineraryData));
      } catch (e) {
        console.error("無法保存至本地存儲", e);
      }
    }

    // 事件監聽 (卡片操作與美食導航)
    mobileCardsContainer.addEventListener("click", (e) => {
      // 處理周邊美食個別導航按鈕
      const foodBtn = e.target.closest("button[data-food-search]");
      if (foodBtn) {
        const query = decodeURIComponent(foodBtn.dataset.foodSearch);
        const curCity = itineraryData[currentDayIndex].spotName || "";
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query + " " + curCity)}`;
        try {
          window.open(mapUrl, "_blank", "noopener,noreferrer");
        } catch (err) {
          window.location.href = mapUrl;
        }
        return;
      }

      const btn = e.target.closest("button");
      if (!btn) return;
      const action = btn.dataset.action;
      const idx = parseInt(btn.dataset.idx, 10);

      if (action === "navigate") {
        const item = itineraryData[currentDayIndex].stops[idx];
        if (item) {
          const mapUrl = (item.lat && item.lng)
            ? `https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}`
            : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name)}`;
          try {
            window.open(mapUrl, "_blank", "noopener,noreferrer");
          } catch (err) {
            window.location.href = mapUrl;
          }
        }
      } else if (action === "locate") {
        focusOnStop(idx);
      } else if (action === "edit") {
        openModal(true, idx);
      } else if (action === "delete") {
        const item = itineraryData[currentDayIndex].stops[idx];
        // 避開原生 confirm()，直接安全確認
        itineraryData[currentDayIndex].stops.splice(idx, 1);
        saveData();
        renderAll();
      }
    });

    itemForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const idx = parseInt(editIndexInput.value, 10);
      const newStop = {
        time: itemTimeInput.value,
        name: itemNameInput.value.trim(),
        duration: itemDurationInput.value.trim(),
        lat: itemLatInput.value ? parseFloat(itemLatInput.value) : undefined,
        lng: itemLngInput.value ? parseFloat(itemLngInput.value) : undefined,
        notes: itemNotesInput.value.trim(),
        foods: itemFoodsInput.value.trim()
      };

      if (idx >= 0) {
        itineraryData[currentDayIndex].stops[idx] = newStop;
      } else {
        if (!itineraryData[currentDayIndex].stops) itineraryData[currentDayIndex].stops = [];
        itineraryData[currentDayIndex].stops.push(newStop);
        itineraryData[currentDayIndex].stops.sort((a, b) => a.time.localeCompare(b.time));
      }

      saveData();
      closeModal();
      renderAll();
    });

    addStopBtn.addEventListener("click", () => openModal(false));
    if (mobileAddBtn) mobileAddBtn.addEventListener("click", () => openModal(false));
    closeModalBtn.addEventListener("click", closeModal);
    cancelModalBtn.addEventListener("click", closeModal);
    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    if (toggleMapBtn) {
      toggleMapBtn.addEventListener("click", () => {
        document.getElementById("mapWrapper").scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    if (scrollToTimelineBtn) {
      scrollToTimelineBtn.addEventListener("click", () => {
        mobileCardsContainer.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    resetBtn.addEventListener("click", () => {
      itineraryData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
      saveData();
      renderAll();
    });

    exportBtn.addEventListener("click", () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(itineraryData, null, 2));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "九州大阪11日行程表.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    // 啟動應用
    window.addEventListener("DOMContentLoaded", () => {
      initMap();
      renderAll();
    });
  </script>
</body>
</html>
